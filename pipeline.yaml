apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: oca-clone-build-push
spec:
  description: | 
    This pipeline clones a git repo, builds a Docker image with Kaniko and
    pushes it to a registry
  params:
  - name: repo-url
    type: string
  - name: image-reference
    type: string
  - name: revision
    type: string
  - name: python_version
    type: string
  - name: odoo_version
    type: string
  - name: codename
    type: string
  workspaces:
  - name: shared-data
  - name: gh-docker-credentials
  - name: git-credentials
    description: SSH credentials for git access
  tasks:
  - name: fetch-source
    taskRef:
      name: git-clone
    workspaces:
    - name: output
      workspace: shared-data
    - name: ssh-directory
      workspace: git-credentials
    params:
    - name: url
      value: $(params.repo-url)
    - name: revision
      value: $(params.revision)
  - name: build-push
    runAfter: ["fetch-source"]
    taskSpec:
      workspaces:
      - name: source
      - name: dockerconfig
      steps:
      - name: build-and-push
        image: gcr.io/kaniko-project/executor:latest
        workingDir: /workspace/source
        env:
        - name: DOCKER_CONFIG
          value: /kaniko/.docker
        command:
        - /kaniko/executor
        args:
        - --dockerfile=Dockerfile.optimized
        - --context=/workspace/source
        - --destination=$(params.image-reference)
        - --build-arg=python_version=$(params.python_version)
        - --build-arg=codename=$(params.codename)  
        - --build-arg=odoo_version=$(params.odoo_version)
        - --snapshotMode=redo
        - --cache=false
        - --single-snapshot
        - --push-retry=5
        - --compressed-caching=false
        resources:
          requests:
            memory: "6Gi"
            cpu: "2"
          limits:
            memory: "12Gi"
            cpu: "4"
        volumeMounts:
        - name: docker-config
          mountPath: /kaniko/.docker
          readOnly: true
      volumes:
      - name: docker-config
        secret:
          secretName: gh-docker-credentials
    workspaces:
    - name: source
      workspace: shared-data
    - name: dockerconfig
      workspace: gh-docker-credentials

